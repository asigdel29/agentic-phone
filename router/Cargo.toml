[package]
name = "wattrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Routes OpenAI-compatible requests to the cheapest upstream model that can serve them."
license = "MIT"

[lib]
name = "wattrouter"
path = "src/lib.rs"

[[bin]]
name = "wattrouter"
path = "src/main.rs"

[features]
# On by default so CI exercises it and the board gets the better embedding.
# Disable to drop ONNX Runtime entirely: `--no-default-features` yields a router
# that only ever hashes, which is the right build for a memory-tight board.
default = ["onnx"]
onnx = ["dep:fastembed"]
# Off by default: the board shells out to git and does not need libgit2 linked
# into a process that would never call it. The iOS build turns it on, because a
# phone has no shell; see docs/decisions/git-without-a-subprocess.md. CI tests
# it through --all-features rather than through the default set.
git = ["dep:git2"]
# Off by default: only a phone needs the memory store bounded, and the board's
# build should not carry SQLite for a table it never opens. The iOS build turns
# it on. CI tests it through --all-features.
memory = ["dep:rusqlite", "dep:zeromem"]
# Off by default and on only for an Android build. The jni crate compiles
# anywhere, and a JVM entry point in a board binary is dead weight that also
# claims something untrue about how the binary is reached.
android = ["dep:jni"]

[dependencies]
# rustls throughout, and default features off. The defaults are
# hf-hub-native-tls and ort-download-binaries-native-tls, both of which drag in
# openssl-sys and fail the aarch64 cross-build outright.
fastembed = { version = "7.5.0", optional = true, default-features = false, features = [
    "hf-hub",
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
# axum over a hand-rolled hyper service: the streaming passthrough added later
# needs body streaming both ways, and axum's Body is hyper's, so the routing
# convenience costs nothing.
axum = "0.8"
# default-features off, then ssh back on by name. It was off entirely until
# #644, on the grounds that the network half was not being done; that half is
# decided now in docs/decisions/pushing-from-a-phone.md, and a key rather than a
# token is what it decided.
#
# ssh pulls libssh2, which pulls openssl-sys on every target but Windows, and
# there is no system OpenSSL on Android to link against. vendored-openssl is
# what answers that: openssl-src builds it from source with the same NDK
# toolchain the rest of the vendored C already uses. https stays off, and that
# is a scope line rather than a permanent one, because it costs almost nothing
# once OpenSSL is here.
#
# Measured on aarch64-linux-android: the shared object goes from 4.6M to 8.4M
# and keeps its 16384-byte page alignment. That is the whole of what this costs
# on a phone, and it is written here because the number is the argument.
#
# 0.20.4 rather than 0.19: below it, GHSA-j39j-6gw9-jw6h dereferences a Buf
# whose pointer is null, which is undefined behaviour even for a zero-length
# slice. Nothing here names Buf, so this was answering an advisory rather than
# fixing a call, and an argument that nothing calls it goes stale the first
# time somebody adds a diff.
#
# Not 0.21, which is published. The bump above is the smallest one that clears
# the advisory, and a version chosen for a reason is worth more than the newest
# when what it vendors is a C library on three targets.
git2 = { version = "0.21.0", optional = true, default-features = false, features = [
    "ssh",
    "vendored-openssl",
] }
# Pinned to the version zeromem uses. Two versions means two libsqlite3-sys,
# which is two copies of SQLite in one binary: it sometimes links, and when it
# does the two hold separate page caches over one file. `bundled` for the same
# reason the Android build needs it: the system SQLite is not there to link
# against on an `aarch64-linux-android` slice.
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
# The JVM's side of the boundary. Header-only in effect: it binds against
# whatever JNI the runtime provides, so nothing here needs a JDK to build.
jni = { version = "0.22", optional = true }
# Pinned by revision rather than by tag: the crate is new and single-author, and
# an unpinned dependency means the memory layer can change under a rebuild with
# no signal. The same revision deploy/install-zeromem.sh puts on the board.
#
# default-features off drops fastembed and the ONNX runtime behind it, which is
# the half that cannot come to a phone at all; see
# docs/decisions/memory-on-a-phone-forgets.md.
zeromem = { git = "https://github.com/ptaranat/zeromem.git", rev = "32ac538", optional = true, default-features = false }
futures-util = { version = "0.3", default-features = false }
# rustls rather than the system OpenSSL: the router cross-compiles to aarch64,
# and vendoring the TLS stack keeps that a pure Rust build.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SHA-256 for token hashing, and not a password KDF. A token is thirty-two
# random bytes this server issued, so there is no dictionary to run against it
# and nothing a work factor would buy -- it would cost every request the time it
# is meant to cost an attacker.
sha2 = "0.11"

[[bench]]
name = "decide"
harness = false

# The serve path needs a mock upstream and a runtime, so it takes the same
# hand-rolled shape as `decide` rather than a harness that would fight both.
[[bench]]
name = "serve"
harness = false

# Spawns the router and drives it over a socket, so it needs a runtime and a
# client rather than a harness that would only get in the way of both.
[[bench]]
name = "load"
harness = false

[dev-dependencies]
# Drives the router directly, so endpoint tests neither bind a port nor race for
# one in CI.
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
http-body-util = "0.1"

[profile.release]
# The target board is small and the binary is long-lived, so favour resident size
# and the optimiser over build time. lto with a single codegen unit cuts both the
# binary and the steady-state footprint measurably.
lto = true
codegen-units = 1
strip = true
